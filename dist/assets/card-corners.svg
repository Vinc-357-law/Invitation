<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="100%" height="100%">
  <!-- Gold-foil double frame, corner flourishes and centre ornaments for the card.
       No viewBox: everything is laid out in real pixels, so it fits any card size without stretching.
       Frame lines: two masked stroke bands of a 100% rect give 1px lines 7px and 12px inside the edge;
       the masks also cut gaps where the corner flourishes and centre ornaments sit.
       Corners: nested <svg x="100%"> anchors each piece to its corner. -->
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e6cb92"/>
      <stop offset=".45" stop-color="#b48545"/>
      <stop offset="1" stop-color="#d6b073"/>
    </linearGradient>
    <g id="cuts" fill="#000">
      <rect x="0" y="0" width="25" height="25"/>
      <svg x="100%" y="0" overflow="visible"><rect x="-25" y="0" width="25" height="25"/></svg>
      <svg x="0" y="100%" overflow="visible"><rect x="0" y="-25" width="25" height="25"/></svg>
      <svg x="100%" y="100%" overflow="visible"><rect x="-25" y="-25" width="25" height="25"/></svg>
      <svg x="50%" y="0" overflow="visible"><rect x="-15" y="0" width="30" height="20"/></svg>
      <svg x="50%" y="100%" overflow="visible"><rect x="-12" y="-17" width="24" height="14"/></svg>
    </g>
    <mask id="outerLine">
      <rect width="100%" height="100%" fill="none" stroke="#fff" stroke-width="16"/>
      <rect width="100%" height="100%" fill="none" stroke="#000" stroke-width="14"/>
      <use href="#cuts" xlink:href="#cuts"/>
    </mask>
    <mask id="innerLine">
      <rect width="100%" height="100%" fill="none" stroke="#fff" stroke-width="26"/>
      <rect width="100%" height="100%" fill="none" stroke="#000" stroke-width="24"/>
      <use href="#cuts" xlink:href="#cuts"/>
    </mask>
    <g id="corner" fill="none" stroke="url(#gold)" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round">
      <path d="M7.5 30 C7.5 17 17 7.5 30 7.5"/>
      <path d="M30 7.5 C38 7.5 42 13 38.5 16.5 C35.5 19.5 32 16.5 34 14"/>
      <path d="M7.5 30 C7.5 38 13 42 16.5 38.5 C19.5 35.5 16.5 32 14 34"/>
      <path d="M12.5 21 C14 16.5 16.5 14 21 12.5"/>
      <path d="M14.5 14.5 l2.8 -2.8 l2.8 2.8 l-2.8 2.8 Z" fill="url(#gold)" stroke-width=".6"/>
    </g>
    <g id="flake" fill="none" stroke="url(#gold)" stroke-width="1.05" stroke-linecap="round">
      <path d="M0 -8 V8 M-6.9 -4 L6.9 4 M-6.9 4 L6.9 -4"/>
      <path d="M-2 -6 L0 -4 L2 -6 M-2 6 L0 4 L2 6 M-6.2 -1 L-3.5 -2 L-4.2 -4.6 M6.2 1 L3.5 2 L4.2 4.6 M-6.2 1 L-3.5 2 L-4.2 4.6 M6.2 -1 L3.5 -2 L4.2 -4.6"/>
    </g>
  </defs>
  <rect width="100%" height="100%" fill="url(#gold)" mask="url(#outerLine)" opacity=".85"/>
  <rect width="100%" height="100%" fill="url(#gold)" mask="url(#innerLine)" opacity=".45"/>
  <use href="#corner" xlink:href="#corner"/>
  <svg x="100%" y="0" overflow="visible"><use href="#corner" xlink:href="#corner" transform="scale(-1 1)"/></svg>
  <svg x="0" y="100%" overflow="visible"><use href="#corner" xlink:href="#corner" transform="scale(1 -1)"/></svg>
  <svg x="100%" y="100%" overflow="visible"><use href="#corner" xlink:href="#corner" transform="scale(-1 -1)"/></svg>
  <svg x="50%" y="0" overflow="visible"><use href="#flake" xlink:href="#flake" transform="translate(0 10)"/></svg>
  <svg x="50%" y="100%" overflow="visible"><path d="M-8 -10 L0 -13.6 L8 -10 L0 -6.4 Z" fill="url(#gold)"/></svg>
</svg>
